name: NovaStream Flutter CI and Android builds

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: novastream-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Flutter analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze --no-pub

      - name: Run all Flutter tests
        run: flutter test --no-pub --reporter expanded

  android:
    name: Build Android APKs
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Build universal release APK
        run: flutter build apk --release

      - name: Build split-per-ABI release APKs
        run: flutter build apk --release --split-per-abi

      - name: Collect APKs and build metadata
        shell: bash
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/*.apk dist/
          {
            echo "Flutter: $(flutter --version | head -n 1)"
            echo "Dart: $(dart --version 2>&1)"
            echo "Commit: $GITHUB_SHA"
            echo "Built at (UTC): $(date -u +%FT%TZ)"
            echo "APK files:"
            sha256sum dist/*.apk
          } > dist/BUILD-REPORT.txt

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: novastream-android-apks
          path: dist/
          if-no-files-found: error
          retention-days: 14
          
